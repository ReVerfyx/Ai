name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Smoke test text checkpoint
        run: |
          ./build/reai text-init /tmp/text.bin 16
          printf 'hello world hello world\n' > /tmp/corpus.txt
          ./build/reai text-train /tmp/text.bin /tmp/corpus.txt 1 4 0.001
          ./build/reai text-generate /tmp/text.bin hello 8 1.0 8 >/tmp/out.txt

      - name: Smoke test sparse checkpoint
        run: |
          ./build/reai sparse-init /tmp/sparse.bin 16 4 32 123
          ./build/reai sparse-info /tmp/sparse.bin
          printf 'hello sparse world hello sparse world\n' > /tmp/sparse-corpus.txt
          ./build/reai sparse-train /tmp/sparse.bin /tmp/sparse-corpus.txt 1 4 0.001
          ./build/reai sparse-generate /tmp/sparse.bin hello 8 1.0 8 >/tmp/sparse-out.txt

      - name: Smoke test Unicode checkpoint
        run: |
          printf 'Привет мир. Это тест Unicode модели. hello world.\n' > /tmp/unicode-corpus.txt
          ./build/reai unicode-init /tmp/unicode.bin /tmp/unicode-corpus.txt 512 32 4 64 123
          ./build/reai unicode-info /tmp/unicode.bin
          ./build/reai unicode-train /tmp/unicode.bin /tmp/unicode-corpus.txt 1 4 0.001
          ./build/reai unicode-generate /tmp/unicode.bin 'Привет' 8 1.0 8 >/tmp/unicode-out.txt
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/unicode-out.txt').read_text(encoding='utf-8')
          PY

      - name: Smoke test focused tiny Unicode checkpoint
        run: |
          printf 'user: Привет!\nassistant: Привет! Чем могу помочь?\n' > /tmp/tiny-corpus.txt
          ./build/reai unicode-init /tmp/tiny.bin /tmp/tiny-corpus.txt 192 64 40 144 123
          ./build/reai unicode-info /tmp/tiny.bin
          ./build/reai unicode-train /tmp/tiny.bin /tmp/tiny-corpus.txt 1 8 0.001
          ./build/reai unicode-generate /tmp/tiny.bin $'user: Привет!\nassistant:' 12 0.55 12 >/tmp/tiny-out.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/tiny-out.txt').read_text(encoding='utf-8')
          assert '重' not in s
          PY

      - name: Smoke test fast dense Unicode profile
        run: |
          python3 tools/make_warmup_corpus.py
          ./build/reai unicode-init /tmp/fast.bin data/warmup/ru-basic.txt 192 128 1 256 1337
          ./build/reai unicode-info /tmp/fast.bin
          ./build/reai unicode-train /tmp/fast.bin data/warmup/ru-basic.txt 1 16 0.002
          ./build/reai unicode-generate /tmp/fast.bin $'user: Кто ты?\nassistant:' 24 0.3 4 >/tmp/fast-out.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/fast-out.txt').read_text(encoding='utf-8')
          assert '�' not in text
          PY

      - name: Smoke test image checkpoint
        run: |
          ./build/reai image-init /tmp/image.bin 4 8
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/a.ppm').write_bytes(b'P6\n4 4\n255\n' + bytes([255,0,0]) * 16)
          Path('/tmp/images.tsv').write_text('/tmp/a.ppm\ta red square\n')
          PY
          ./build/reai image-train /tmp/image.bin /tmp/images.tsv 1 0.001
          ./build/reai image-generate /tmp/image.bin 'a red square' /tmp/out.ppm 4

      - name: Python syntax
        run: |
          python3 -m py_compile api/server.py gateway/server.py policy/engine.py policy/runtime.py
          python3 -m py_compile tools/crawl.py tools/build_corpus.py tools/multi_train.py tools/self_learn.py tools/wiki_fetch.py tools/auto_research.py tools/progress.py tools/web_search.py tools/observer.py tools/self_improve.py tools/manage.py tools/make_warmup_corpus.py tools/sandbox_exec.py
          PYTHONPATH=. python3 policy/test_runtime.py

      - name: Policy tests
        run: python3 policy/test_policy.py
